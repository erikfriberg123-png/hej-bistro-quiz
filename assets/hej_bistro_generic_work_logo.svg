  <text x="340" y="455" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="136" font-weight="200" fill="none" stroke="#FF8000" stroke-width="10" opacity="0.22" style="fill:none;stroke:rgb(255, 128, 0);color:rgb(0, 0, 0);stroke-width:10px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.22;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:136px;font-weight:200;text-anchor:middle;dominant-baseline:auto">?</text>

  <!-- Question mark neon line -->
  <text x="340" y="455" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="136" font-weight="200" fill="none" stroke="#FF8800" stroke-width="2.8" filter="url(#glow-soft)" style="fill:none;stroke:rgb(255, 136, 0);color:rgb(0, 0, 0);stroke-width:2.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:136px;font-weight:200;text-anchor:middle;dominant-baseline:auto">?</text>

  <!-- Question mark bright centre -->
  <text x="340" y="455" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="136" font-weight="200" fill="none" stroke="#FFDD88" stroke-width="0.9" opacity="0.75" style="fill:none;stroke:rgb(255, 221, 136);color:rgb(0, 0, 0);stroke-width:0.9px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.75;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:136px;font-weight:200;text-anchor:middle;dominant-baseline:auto">?</text>
