    <rect x="175" y="248" width="330" height="258" rx="18" style="fill:none;stroke:rgb(255, 136, 0);color:rgb(0, 0, 0);stroke-width:2.8px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <path d="M258,248 L258,196 Q258,164 292,164 L388,164 Q420,164 420,196 L420,248" style="fill:none;stroke:rgb(255, 136, 0);color:rgb(0, 0, 0);stroke-width:2.8px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

  <!-- Bright centre highlight on briefcase -->
  <g fill="none" stroke="#FFDD88" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.9" opacity="0.75" style="fill:none;stroke:rgb(255, 221, 136);color:rgb(0, 0, 0);stroke-width:0.9px;stroke-linecap:round;stroke-linejoin:round;opacity:0.75;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <rect x="175" y="248" width="330" height="258" rx="18" style="fill:none;stroke:rgb(255, 221, 136);color:rgb(0, 0, 0);stroke-width:0.9px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <path d="M258,248 L258,196 Q258,164 292,164 L388,164 Q420,164 420,196 L420,248" style="fill:none;stroke:rgb(255, 221, 136);color:rgb(0, 0, 0);stroke-width:0.9px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

  <!-- Question mark outer ambient glow -->
  <text x="340" y="455" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="136" font-weight="200" fill="none" stroke="#FF8000" stroke-width="28" opacity="0.1" style="fill:none;stroke:rgb(255, 128, 0);color:rgb(0, 0, 0);stroke-width:28px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:136px;font-weight:200;text-anchor:middle;dominant-baseline:auto">?</text>

